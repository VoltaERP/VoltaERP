<section class="bg-gray-50">
  <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
    <!-- Brand -->
    <div class="flex items-center mb-6 gap-2">
      <img
        ngSrc="/logo-pequeno.png"
        width="32"
        height="32"
        alt="Logo VoltaERP"
        class="w-8 h-8 object-contain"
        priority
      />
      <span class="text-2xl font-semibold text-gray-900">VoltaERP</span>
    </div>
    <!-- Card -->
    <div class="w-full bg-white rounded-lg shadow sm:max-w-md xl:p-0">
      <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
        <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl">
          Iniciar sesión
        </h1>
        @if (errorMessage()) {
          <div role="alert" class="p-3 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg">
            {{ errorMessage() }}
          </div>
        }
        <form class="space-y-4 md:space-y-6" (submit)="onSubmit($event)" novalidate>
          <div>
            <label for="email" class="block mb-2 text-sm font-medium text-gray-900">
              Correo electrónico
            </label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="nombre@empresa.com"
              [value]="email()"
              (input)="email.set($any($event.target).value)"
              class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5"
              required
            />
          </div>
          <div>
            <label for="password" class="block mb-2 text-sm font-medium text-gray-900">
              Contraseña
            </label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="••••••••"
              [value]="password()"
              (input)="password.set($any($event.target).value)"
              class="bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5"
              required
            />
          </div>
          <button
            type="submit"
            [disabled]="isLoading()"
            class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center disabled:opacity-60 disabled:cursor-not-allowed"
          >
            @if (isLoading()) {
              Entrando...
            } @else {
              Iniciar sesión
            }
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
