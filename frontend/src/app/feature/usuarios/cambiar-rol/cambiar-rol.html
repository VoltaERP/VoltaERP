<dialog
  #dialogo
  aria-labelledby="titulo-cambiar-rol"
  (close)="cerrado.emit()"
  class="m-auto w-full max-w-md rounded-lg bg-white p-0 shadow-xl backdrop:bg-gray-900/50"
>
  <form novalidate (submit)="guardar($event)">
    <!-- Cabecera -->
    <div class="flex items-center justify-between border-b border-gray-200 p-4">
      <h2 id="titulo-cambiar-rol" class="text-lg font-semibold text-gray-900">
        Cambiar rol de {{ usuario().nombre }}
      </h2>
      <button
        type="button"
        (click)="cerrar()"
        aria-label="Cerrar"
        class="inline-flex w-8 h-8 items-center justify-center rounded-lg text-gray-500 hover:bg-gray-200 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Opciones de rol -->
    <div class="space-y-3 p-4">
      @if (error()) {
        <p class="rounded-lg bg-red-50 p-3 text-sm text-red-800" role="alert">{{ error() }}</p>
      }

      <fieldset>
        <legend class="mb-3 text-sm text-gray-700">
          Rol actual: <span class="font-semibold text-gray-900">{{ etiquetasRol[usuario().rol] }}</span>
        </legend>
        <ul class="space-y-2">
          @for (rol of roles; track rol) {
            <li>
              <label
                [for]="'rol-' + rol"
                class="flex cursor-pointer gap-3 rounded-lg border p-3 hover:bg-gray-50"
                [class]="rolSeleccionado() === rol ? 'border-blue-600 bg-blue-50' : 'border-gray-200'"
              >
                <input
                  [id]="'rol-' + rol"
                  type="radio"
                  name="rol"
                  [value]="rol"
                  [checked]="rolSeleccionado() === rol"
                  (change)="seleccionar(rol)"
                  [attr.aria-describedby]="'rol-desc-' + rol"
                  class="mt-0.5 w-4 h-4 text-blue-600 focus:ring-2 focus:ring-blue-500"
                />
                <span>
                  <span class="block text-sm font-medium text-gray-900">{{ etiquetasRol[rol] }}</span>
                  <span [id]="'rol-desc-' + rol" class="block text-sm text-gray-600">{{ descripciones[rol] }}</span>
                </span>
              </label>
            </li>
          }
        </ul>
      </fieldset>
    </div>

    <!-- Pie -->
    <div class="flex justify-end gap-3 border-t border-gray-200 p-4">
      <button
        type="button"
        (click)="cerrar()"
        class="rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-900 hover:bg-gray-100 focus:outline-none focus:ring-4 focus:ring-gray-200"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="sinCambios() || guardando()"
        class="rounded-lg bg-blue-700 px-4 py-2.5 text-sm font-medium text-white hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ guardando() ? 'Guardando…' : 'Cambiar rol' }}
      </button>
    </div>
  </form>
</dialog>
